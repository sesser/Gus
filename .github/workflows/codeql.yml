name: CodeQL

# Not on pushes to develop: every merge there was already analyzed as a pull
# request, and the second macOS runner requested next to the build job's often
# goes unassigned until GitHub cancels it. The weekly run analyzes develop (the
# default branch) for the code scanning baseline.
on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (swift)
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6

      - uses: github/codeql-action/init@v4
        with:
          languages: swift
          build-mode: manual

      - name: Build
        run: swift build

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:swift
