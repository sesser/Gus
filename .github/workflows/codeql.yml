name: CodeQL

# Not on pull requests or pushes to develop: the second macOS runner requested
# next to the build job's often goes unassigned until GitHub cancels it, and an
# analysis per pull request costs more than it finds. Runs on releases (pushes
# to master), weekly, and by hand. A scheduled run always uses the default
# branch, so the weekly run analyzes develop: the code scanning baseline, where
# alerts show.
on:
  push:
    branches: [master]
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (swift)
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6

      - uses: github/codeql-action/init@v4
        with:
          languages: swift
          build-mode: manual

      - name: Build
        run: swift build

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:swift
