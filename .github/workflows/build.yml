name: Build and test

on:
  push:
    branches: [develop, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    # macos-15 checks the oldest supported macOS (the deployment target). Its
    # default Xcode 16.4 cannot build the app (it uses the macOS 26 SDK), so
    # that runner selects its Xcode 26 instead.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
          - os: macos-15
            xcode: "26.3"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode ${{ matrix.xcode }}
        if: matrix.xcode
        run: sudo xcode-select -s "/Applications/Xcode_${{ matrix.xcode }}.app"

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - uses: actions/cache@v5
        with:
          path: .build
          key: spm-${{ matrix.os }}-xcode${{ matrix.xcode }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ matrix.os }}-xcode${{ matrix.xcode }}-

      - name: Build
        run: swift build

      - name: Test
        # Every golden's difference goes to the log, and mismatches are kept
        # as expected | actual | 8x difference images for the artifact below.
        env:
          GOLDENS_REPORT: "1"
          GOLDEN_FAILURES_DIR: ${{ runner.temp }}/golden-failures
        run: swift test

      - name: Upload golden failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures-${{ matrix.os }}
          path: ${{ runner.temp }}/golden-failures
          if-no-files-found: ignore

      - name: Build app bundles
        run: Scripts/build-app.sh all
