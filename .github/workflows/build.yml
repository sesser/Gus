name: Build and test

on:
  push:
    branches: [develop, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    # macos-15 checks the oldest supported macOS (the deployment target) with
    # that runner's default Xcode.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - uses: actions/cache@v5
        with:
          path: .build
          key: spm-${{ matrix.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ matrix.os }}-

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Build app bundles
        run: Scripts/build-app.sh all
