name: Build and test

on:
  push:
    branches: [develop, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    # macos-15 checks the oldest supported macOS (the deployment target). Its
    # default Xcode 16.4 cannot build the app (it uses the macOS 26 SDK), so
    # that runner selects its Xcode 26 instead.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
          - os: macos-15
            xcode: "26.3"
    runs-on: ${{ matrix.os }}
    # Checkout and Build (up to about 5 minutes), the Test step's limit, and
    # the uploads after a failure.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Detect code changes
        id: changes
        # See the action for the rule; the bundles job uses the same one.
        uses: ./.github/actions/detect-code-changes

      - name: Select Xcode ${{ matrix.xcode }}
        if: matrix.xcode && steps.changes.outputs.code == 'true'
        run: sudo xcode-select -s "/Applications/Xcode_${{ matrix.xcode }}.app"

      - name: Toolchain
        if: steps.changes.outputs.code == 'true'
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Build
        if: steps.changes.outputs.code == 'true'
        run: swift build

      - name: Test
        if: steps.changes.outputs.code == 'true'
        # Every golden's difference goes to the log, and mismatches are kept
        # as expected | actual | 8x difference images for the artifact below.
        # SWIFT_BACKTRACE: a crash in the test process (signal 11 on develop
        # since PR #39, never reproduced locally) prints a symbolicated
        # backtrace of every thread to the log; tests run in parallel, so the
        # log alone does not say which one crashed.
        # A crash with signal 11 (Apple's virtual GPU driver on these runners,
        # roadmap ci-test-crash) is retried once in this step. Any other
        # failure fails at once.
        # The limit covers two full runs, the second being that retry: the
        # step took 344 to 522 s (median 416 s) on the six jobs measured after
        # PR #258, so two of the slowest are 17.4 minutes. A hang then fails
        # here, with the crash reports below uploaded, instead of the job
        # being cancelled with nothing kept.
        timeout-minutes: 20
        env:
          GOLDENS_REPORT: "1"
          GOLDEN_FAILURES_DIR: ${{ runner.temp }}/golden-failures
          SWIFT_BACKTRACE: enable=yes,interactive=no,threads=all,output-to=stderr
        shell: bash
        run: |
          log="$RUNNER_TEMP/swift-test.log"
          status=0
          swift test 2>&1 | tee "$log" || status=$?
          if [ "$status" -ne 0 ] && grep -qE 'Signal 11: Backtracing|unexpected signal code 11' "$log"; then
            echo "::warning::swift test crashed with signal 11; retrying once"
            swift test
          else
            exit "$status"
          fi

      - name: Upload golden failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures-${{ matrix.os }}
          path: ${{ runner.temp }}/golden-failures
          if-no-files-found: ignore

      - name: Collect crash reports
        # The system's crash reports (.ips), for crashes inside Apple's
        # frameworks that the Swift backtrace can't name. The runner is a
        # fresh machine, so every report is from this job.
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/crash-reports"
          find "$HOME/Library/Logs/DiagnosticReports" /Library/Logs/DiagnosticReports \
            -name '*.ips' -exec cp {} "$RUNNER_TEMP/crash-reports/" \; 2>/dev/null || true
          ls -l "$RUNNER_TEMP/crash-reports"

      - name: Upload crash reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crash-reports-${{ matrix.os }}
          path: ${{ runner.temp }}/crash-reports
          if-no-files-found: ignore

  bundles:
    name: Build app bundles (${{ matrix.os }})
    # Beside the tests, not after them: the bundles took 286 to 437 s of each
    # job. A required check like the jobs above, so it reports on
    # documentation-only changes the same way.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
          - os: macos-15
            xcode: "26.3"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Detect code changes
        id: changes
        uses: ./.github/actions/detect-code-changes

      - name: Select Xcode ${{ matrix.xcode }}
        if: matrix.xcode && steps.changes.outputs.code == 'true'
        run: sudo xcode-select -s "/Applications/Xcode_${{ matrix.xcode }}.app"

      - name: Toolchain
        if: steps.changes.outputs.code == 'true'
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Build app bundles
        if: steps.changes.outputs.code == 'true'
        run: Scripts/build-app.sh all
